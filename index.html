<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Heaven 🧿🎀</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --lavender: #e6e6fa;
            --deep-purple: #4b0082;
            --glow: rgba(230, 230, 250, 0.6);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Georgia', serif;
            background: linear-gradient(45deg, #f3e5f5, #e1bee7, #ce93d8);
            background-size: 400% 400%;
            animation: skyGradient 15s ease infinite;
        }

        @keyframes skyGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Entry Portal */
        #portal {
            position: fixed; inset: 0; background: white; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease;
        }

        #enter-btn {
            background: #d63384; color: white; border: none;
            padding: 15px 40px; border-radius: 50px; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* 3D Scene */
        .scene {
            width: 100vw; height: 100vh; display: none;
            perspective: 1000px; justify-content: center; align-items: center;
        }

        .orbit-container {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orbit-item {
            position: absolute; left: 50%; top: 50%;
            font-size: 3.5rem; cursor: pointer;
            transition: transform 3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 2s;
            filter: drop-shadow(0 0 15px var(--glow));
            animation: breath 3s ease-in-out infinite;
        }

        @keyframes breath {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 10px var(--glow)); }
            50% { transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 0 25px var(--lavender)); }
        }

        /* Initial Clumped Positions (Hidden/Close) */
        .item { opacity: 0; transform: translate(-50%, -50%) translateZ(-100px); }

        /* The Expansion Bloom (Horizontal Carousel) */
        .active-orbit .item-1 { opacity: 1; transform: translate(-50%, -50%) rotateY(0deg) translateZ(280px); }
        .active-orbit .item-2 { opacity: 1; transform: translate(-50%, -50%) rotateY(60deg) translateZ(280px); }
        .active-orbit .item-3 { opacity: 1; transform: translate(-50%, -50%) rotateY(160deg) translateZ(280px); }
        .active-orbit .item-4 { opacity: 1; transform: translate(-50%, -50%) rotateY(220deg) translateZ(280px); }
        .active-orbit .item-5 { opacity: 1; transform: translate(-50%, -50%) rotateY(300deg) translateZ(280px); }

        .rotating { animation: rotateScene 25s linear infinite; }
        @keyframes rotateScene { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px; padding: 30px; width: 80%; max-width: 350px;
            z-index: 10; text-align: center; color: var(--deep-purple);
        }

        /* Particles */
        .particle {
            position: fixed; pointer-events: none; z-index: 2000;
            animation: explode 1.2s forwards cubic-bezier(0, 0, 0.2, 1);
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Final Cake & Poppers */
        #cake-box { display: none; font-size: 5rem; cursor: pointer; margin: 20px; }
        .anniversary-text { font-size: 1.4rem; color: #d63384; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div id="portal">
    <h1 style="color: #4b0082; margin-bottom: 30px;">For My Cutie 🧿</h1>
    <button id="enter-btn">Enter Our Heaven 🎀</button>
</div>

<div class="scene" id="main-scene">
    <div class="orbit-container" id="orbit-node">
        <div class="orbit-item item item-1" onclick="handleTouch(event, '🐈')">🐈</div>
        <div class="orbit-item item item-2" onclick="handleTouch(event, '🍦')">🍦</div>
        <div class="orbit-item item item-3" onclick="handleTouch(event, '🍛')">🍛</div>
        <div class="orbit-item item item-4" onclick="handleTouch(event, '👜')">👜</div>
        <div class="orbit-item item item-5" onclick="handleTouch(event, '💄')">💄</div>
    </div>

    <div class="glass-card">
        <div id="cake-box" onclick="startFinale()">🎂</div>
        <div id="text-display">Explore your favorite things while the music builds... 🧿</div>
        <div id="final-message" class="anniversary-text" style="display:none;"></div>
    </div>
</div>

<div id="yt-player"></div>

<script>
    let player;
    let itemsFound = new Set();
    const totalItems = 5;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player', {
            height: '0', width: '0',
            videoId: 'bM7SZ5SbzyY', 
            playerVars: { 'start': 0, 'controls': 0 }
        });
    }

    document.getElementById('enter-btn').addEventListener('click', () => {
        document.getElementById('portal').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('portal').style.display = 'none';
            document.getElementById('main-scene').style.display = 'flex';
            player.playVideo();
            
            // Bloom at 45 seconds (or simulate for testing)
            setTimeout(bloomEffect, 45000); 
        }, 1500);
    });

    function bloomEffect() {
        const orbit = document.getElementById('orbit-node');
        orbit.classList.add('active-orbit');
        setTimeout(() => orbit.classList.add('rotating'), 3000);
        document.getElementById('text-display').innerText = "Touch your treasures... 🐾❤️";
    }

    function handleTouch(e, emoji) {
        itemsFound.add(emoji);
        
        // Sound & Sparkles
        if(emoji === '🐈') playMeow();
        createSparkles(e.clientX, e.clientY, ['🐾', '❤️', '✨']);

        if(itemsFound.size === totalItems) {
            document.getElementById('text-display').innerText = "Something sweet is arriving... 🎁";
            setTimeout(() => {
                document.getElementById('cake-box').style.display = 'block';
            }, 2000);
        }
    }

    function createSparkles(x, y, particles) {
        for(let i=0; i<12; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = particles[Math.floor(Math.random()*particles.length)];
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.setProperty('--tx', (Math.random() - 0.5) * 300 + 'px');
            p.style.setProperty('--ty', (Math.random() - 0.5) * 300 + 'px');
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1200);
        }
    }

    function startFinale() {
        document.getElementById('cake-box').innerHTML = "🍰✨";
        createSparkles(window.innerWidth/2, window.innerHeight/2, ['🎉', '🎊', '✨', '💖']);
        document.getElementById('final-message').style.display = 'block';
        typeWriter("Happy 2nd Anniversary my cutie, I love you so much my bby! 🧿🎀");
    }

    function typeWriter(text) {
        let i = 0;
        const target = document.getElementById('final-message');
        target.innerHTML = "";
        const interval = setInterval(() => {
            target.innerHTML += text[i];
            i++;
            if(i >= text.length) clearInterval(interval);
        }, 80);
    }

    function playMeow() {
        const audio = new Audio('https://www.myinstants.com/media/sounds/meow.mp3');
        audio.play();
    }
</script>
</body>
</html>
